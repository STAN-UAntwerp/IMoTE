site_name: "IMoTE: Interactive Model Tree Explorer"
site_description: User guide and documentation for the Dash application
site_url: https://stan-uantwerp.github.io/IMoTE/
repo_name: STAN-UAntwerp/IMoTE
repo_url: https://github.com/STAN-UAntwerp/IMoTE

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: false
            show_root_full_path: false
            show_object_full_path: false
            show_signature_annotations: true
            members_order: source
            show_source: true
            group_by_category: true     # Required: Generates the "Classes", "Functions" headers
            show_symbol_type_heading: true # Displays small category badges next to item names
            show_symbol_type_toc: true

extra_css:
  - assets/stylesheets/custom.css
  - assets/stylesheets/custom_api.css

nav:
  - Home: index.md

  - User Guide:
    - Interface Overview: user-guide/interface-overview.md

    - Interaction Cards:
        - Tree Info: user-guide/a-tree-info.md
        - Node Information: user-guide/b-node-info.md
        - New Tree: user-guide/c-new-tree.md
        - Edit Tree: user-guide/d-edit-tree.md
        - Layout: user-guide/e-layout.md
        - Highlight: user-guide/f-highlight.md

  - Adapter:
    - Overview: adapter/adapter_overview.md
    - Example: adapter/partykit_example.md

  - Reference:
    - Overview: reference/reference_overview.md
    - VizTree: reference/viz_tree.md
    - Adapters:
      - BaseAdapter: reference/adapters/base_adapter.md
      - PartyKitAdapter: reference/adapters/partykit_adapter.md
    - Nodes:
      - BaseNode: reference/nodes/base_node.md
      - NodeModel: reference/nodes/node_model.md
      - InternalNode: reference/nodes/internal_node.md
      - SplitNode: reference/nodes/split_node.md
      - LeafNode: reference/nodes/leaf_node.md
      - NoneNode: reference/nodes/none_node.md
#      - CollapsedNode: reference/nodes/collapsed_node.md
#      - CombinedLinNode: reference/nodes/combined_lin_node.md

  - Gallery: gallery.md