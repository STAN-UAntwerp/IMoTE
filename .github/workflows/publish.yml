name: Publish Python Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  tests:
    name: Run the test suite
    uses: ./.github/workflows/tests.yml

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm needs the tags to work out the version

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # IMoTE is pure Python, so one py3-none-any wheel covers every platform
    - name: Build sdist and wheel
      run: |
        pip install build twine
        python -m build
        twine check dist/*

    # setuptools-scm takes the version from the tag, check that it really did
    # (a dirty checkout, or a tag like v1.0.0-rc1 that normalizes to 1.0.0rc1, would not match)
    - name: Check that the built version matches the tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        ls dist
        test -f "dist/imote-$TAG_VERSION.tar.gz"
        test -f "dist/imote-$TAG_VERSION-py3-none-any.whl"

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [tests, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Install twine
      run: pip install twine

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload dist/*
