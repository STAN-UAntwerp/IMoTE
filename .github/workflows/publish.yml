name: Publish Python Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  tests:
    name: Run the test suite
    uses: ./.github/workflows/tests.yml

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # the version lives in imote/__init__.py (__version__)
    # check that the tag matches it and stop if it wasn't changed
    - name: Check that the tag matches imote.__version__
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        CODE_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' imote/__init__.py)
        echo "tag: $TAG_VERSION, imote/__init__.py: $CODE_VERSION"
        test "$TAG_VERSION" = "$CODE_VERSION"

    # IMoTE is pure Python, so one py3-none-any wheel covers every platform
    - name: Build sdist and wheel
      run: |
        pip install build twine
        python -m build
        twine check dist/*

    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: [tests, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Install twine
      run: pip install twine

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload dist/*
