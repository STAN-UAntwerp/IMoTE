[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "IMoTE"
dynamic = ["version"]
description = "IMoTE: Interactive MOdel Tree Explorer, an interactive app to visualise and explore linear model trees"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Flor Debois", email = "flor.debois@uantwerpen.be"},
    {name = "Thomas Servotte", email = "thomas.servotte@uantwerpen.be"},
    {name = "Jakob Raymaekers", email = "jakob.raymaekers@uantwerpen.be"},
    {name = "Tim Verdonck", email = "tim.verdonck@uantwerpen.be"}
]
keywords = ["linear model trees", "visualization", "interpretability", "machine learning", "decision trees", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Dash",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dash>=4.2",                        # dcc.Dropdown(...) in the node info card needs Dash 4.2
    "dash-bootstrap-components>=1.6",
    "dash-cytoscape>=1.0",
    "flask>=3.0",                       # Flask 2.x breaks with the Werkzeug 3 that Dash 4 installs

    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.6",                  # Colormap.resampled() needs 3.6
    "seaborn>=0.13",
    "pmlb>=1.0",                        # datasets

    "fast-model-trees>=0.0.5",          # PILOT
    "m5py>=0.3.3",                      # M5
    "scikit-learn>=1.3,<1.9",           # upper bound for m5py to work
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "build",
    "twine"
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
imote = "imote.app:main"

[project.urls]
Homepage = "https://github.com/STAN-UAntwerp/IMoTE"
Documentation = "https://stan-uantwerp.github.io/IMoTE/"
Repository = "https://github.com/STAN-UAntwerp/IMoTE"
Issues = "https://github.com/STAN-UAntwerp/IMoTE/issues"

# the version comes from the latest git tag (v0.2.0 -> 0.2.0), see publish.yml
[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["imote*"]

[tool.setuptools.package-data]
imote = ["data/initial_tree.pkl"]
